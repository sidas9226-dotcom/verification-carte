<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande Envoyée - Vérification Carte Cadeau</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-image: url('image2.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 40px 25px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }
        .icon-check {
            font-size: 55px;
            color: #4cd964;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 24px;
            text-transform: uppercase;
            color: #4cd964;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        p {
            color: #cccccc;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .back-btn {
            display: inline-block;
            width: 100%;
            padding: 16px;
            background-color: #007aff;
            border-radius: 10px;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .back-btn:hover {
            background-color: #005ec4;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon-check">✓</div>
    <h1>Demande reçue</h1>
    <p>Merci ! Les informations de votre ticket ont bien été transmises à notre service de vérification. Le traitement est en cours.</p>
    <a href="index.html" class="back-btn">Vérifier un autre ticket</a>
</div>

</body>
</html>
